[package]
name = "codequest"
version = "1.0.0"
description = "CodeQuest - plataforma gamificada para aprender programacao"
authors = ["Davi B. Tarquinio", "Luiz A. S. P. Jr", "Kauan F. Arruda"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codequest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# O instalador do Windows/Linux fica bem menor com estas opcoes.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
